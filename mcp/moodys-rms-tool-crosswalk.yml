  openapi/moodys-rms-location-intelligence-openapi.yaml
note: >-
  Moody's RMS's Platform MCP Server is a meta-tool server, not a one-tool-per-endpoint projection of the
  REST surface. Fifteen of its sixteen tools operate on a knowledge graph built from the Platform API
  specifications, documentation, and code samples; only one tool — execute-api — actually calls REST
  operations, and it is a generic dispatcher that can reach any Platform API operation the caller's
  role permits. The crosswalk therefore binds tools to REST by ROLE (discovery/meta vs execution) rather
  than one-to-one, and records the divergence honestly instead of inventing per-operation tools.
