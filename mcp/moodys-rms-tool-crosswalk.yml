    note: Only 2 of 365 operations declare an operationId, so this spec cannot be bound by operationId.
  graphql:
    present: false
    note: >-
      An ExposureIQ GraphQL API exists internally but the provider's own Support Policy names it as an
      unsupported, undocumented internal API. No endpoint or SDL is published, so it is out of scope.
  mcp:
    server: irp-integration-mcp
    url: https://api-use1.rms.com/platform/integration/v1/mcp
    gated: true
    gate_note: 'tools/list returned HTTP 401 {"message":"Unauthorized"} on 2026-07-25; tool names and descriptions come from the published Platform MCP Server Tools reference.'
  platform_apis:
    documented: true
    openapi_published: false
    note: >-
      The ~24 Platform API families (Accumulation, Admin Data, Auto Select, Batch, Bulk Geohaz, Clone,
      Copy, Currency Conversion, Enrich Exposure, ESG Data, Exchange Data, Export, Geohaz, Grouping,
      Import, Legacy, Model, Peril Converter, Reference Data, Risk Data, Security, STEP, Tenant Data,
      Variation) are the surface execute-api actually dispatches to, but no downloadable OpenAPI is
      published for them. They are documented as rendered ReadMe reference pages only.
crosswalk:
- tool: execute-api
  category: API Execution
  binding: rest
  rest:
  - '*'
  confidence: medium
  note: >-
    Generic dispatcher. Runs any Platform API operation the MCP client is entitled to by role-based
    permission. It fans out to the whole REST surface rather than a named operationId, so no single
    backing operation can be asserted. Its real input contract is the target operation's parameters and
    requestBody in the corresponding Platform API reference.
