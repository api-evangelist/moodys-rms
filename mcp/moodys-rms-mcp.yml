generated: '2026-07-25'
method: searched
status: published
source: https://developer.rms.com/platform/docs/platform-mcp-server-overview
docs:
- https://developer.rms.com/platform/docs/platform-mcp-server-overview
- https://developer.rms.com/platform/docs/platform-mcp-server-tools
- https://developer.rms.com/platform/docs/platform-mcp-server-integration
announced:
  release: 2026.07.c
  date: '2026-06-30'
  changelog: https://developer.rms.com/platform/changelog/202607b
server:
  name: irp-integration-mcp
  title: Platform MCP Server
  transport: http
  protocol: Streamable HTTP
  urls:
  - region: Americas (US)
    url: https://api-use1.rms.com/platform/integration/v1/mcp
  - region: Europe (EU)
    url: https://api-euw1.rms.com/platform/integration/v1/mcp
  description: >-
    A service that securely connects a tenant's AI applications with the Intelligent Risk Platform and
    developer resources. The Platform MCP Server transforms Platform API specifications, documentation,
    and code samples into a single queryable knowledge graph that lets Intelligent Risk Platform tenants
    discover and implement catastrophe modeling and reinsurance workflows.
authentication:
  type: apiKey
  in: header
  parameter: Authorization
  self_serve: false
  note: >-
    Every request is authenticated at Moody's API gateway by an Intelligent Risk Platform API key. API keys
    are issued by a tenant administrator in Admin Center, never self-serve. The API key must belong to a
    user group assigned the "IRP Agentic Tools User" role.
  roles:
  - role: IRP Agentic Tools User
    permissions:
    - action: Access Platform MCP Server
      level: read
      description: Connect to Platform MCP Server and use Knowledge Graph, API Discovery, Skills, and Session Management tools.
    - action: Execute APIs with Platform MCP Server
      level: write
      description: Use the Execution tool to make Platform API requests.
  docs: https://developer.rms.com/platform/docs/authentication-and-authorization
probe:
  url: https://api-use1.rms.com/platform/integration/v1/mcp
  method: 'POST jsonrpc tools/list'
  status: 401
  body: '{"message":"Unauthorized"}'
  date: '2026-07-25'
  note: >-
    Live tools/list introspection is auth-gated. The tool list below is captured verbatim from the
    provider''s published Platform MCP Server Tools reference; per-tool inputSchema requires an
    authenticated tenant introspection and is therefore not recorded.
supported_hosts:
- Claude Code
- Claude Desktop
- Cursor
- Devin
- JetBrains AI Assistant (IntelliJ)
- Visual Studio Code
install:
  claude_code: |-
    claude mcp add --transport http irp-integration-mcp \
      https://api-use1.rms.com/platform/integration/v1/mcp \
      --header "Authorization: YOUR_IRP_API_KEY"
  json: |-
    {
      "mcpServers": {
        "irp-integration-mcp": {
          "url": "https://api-use1.rms.com/platform/integration/v1/mcp",
          "headers": { "Authorization": "YOUR_IRP_API_KEY" }
        }
      }
    }
tool_categories:
- name: Knowledge Graph
  description: Explore the Platform MCP Server knowledge graph to identify Platform API operations and resources that support a given Intelligent Risk Platform workflow.
- name: API Discovery
  description: Search Platform API specifications and developer resources for information on using Platform APIs.
- name: API Execution
  description: Submit requests using the Platform APIs.
- name: Skills
  description: Identify proven paths for designing Intelligent Risk Platform workflows (beta).
- name: Session Management
  description: Set and manage session variables.
tools:
- name: graph-suggest-workflow
  category: Knowledge Graph
  description: Suggest a workflow of Platform API operations to achieve a stated goal.
- name: graph-find-related
  category: Knowledge Graph
  description: Discover API operations related to a specific Platform API.
- name: graph-explore
  category: Knowledge Graph
  description: Explore the knowledge graph by API operation — upstream, downstream, or both.
- name: graph-get-workflow
  category: Knowledge Graph
  description: Retrieve proven workflow patterns from the knowledge graph.
- name: graph-validate-chain
  category: Knowledge Graph
  description: Validate a proposed workflow to determine whether it is feasible.
- name: get-doc-context
  category: Knowledge Graph
  description: Retrieve developer documentation for an API operation or workflow of related operations.
- name: vector-search
  category: Knowledge Graph
  description: Search the knowledge graph for API operations based on semantic similarity.
- name: search-api-spec
  category: API Discovery
  description: Search the Platform API specifications by operation, description, endpoint, or resource.
- name: get-operation-spec
  category: API Discovery
  description: Retrieve complete specification for an operation.
- name: search-workflows
  category: API Discovery
  description: Search the library of API workflows.
- name: get-workflow
  category: API Discovery
  description: Retrieve a complete, runnable workflow collection.
- name: execute-api
  category: API Execution
  description: Run Platform API operations available to the MCP client based on role-based permissions.
- name: skill-workflow-assist
  category: Skills
  status: beta
  description: Workflow assistant that combines knowledge graph discovery with guided reasoning to perform multi-step workflows. Requires the MCP client to support MCP sampling.
- name: skill-fetch-api-data
  category: Skills
  status: beta
  description: Guided, repeatable data retrieval of Intelligent Risk Platform API documentation.
- name: set-variable
  category: Session Management
  description: Set session variables, e.g. Intelligent Risk Platform hosts or credentials.
- name: get-variables
  category: Session Management
  description: List session variables.
counts:
  tools: 16
  categories: 5
data_residency: >-
  All tenant data remains on the Intelligent Risk Platform. Data is not duplicated, copied, or moved to an
  AI environment outside the Intelligent Risk Platform.
