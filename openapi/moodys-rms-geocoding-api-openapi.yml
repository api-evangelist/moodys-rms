openapi: 3.2.0
info:
  title: Location Intelligence Geocoding API
  version: 2022.09.c
  description: Use LI API data to access RMS model insights in a flexible, scalable, and programmable way. The suite of layers includes exposure enhancement, geocoding, hazard, risk scoring, and loss costs to provide information for key decisions in the underwriting workflow, including screening, selection, and pricing.
servers:
- url: https://{host}/li
  description: Location Intelligence
  variables:
    host:
      enum:
      - api-euw1.rms.com
      - api-use1.rms.com
      default: api-euw1.rms.com
      description: 'Data center that hosts the tenant instance: api-euw1.rms.com or api-use1.rms.com.'
security:
- apiKey: []
tags:
- name: Geocoding
  description: Geocodes an address
paths:
  /geocode/18.0:
    post:
      tags:
      - Geocoding
      summary: Geocode Address 18.0
      requestBody:
        description: Address to geocode
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeocodeInput'
            example:
              countryCode: US
              countryScheme: ISO2A
              admin1Code: CA
              postalCode: '94560'
              streetAddress: 7575 GATEWAY BLVD
        required: true
      responses:
        '200':
          description: Everything worked as expected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeOutput'
        '400':
          $ref: '#/components/responses/400Response'
        '401':
          $ref: '#/components/responses/401Response'
