components:
  schemas:
    FacReinsurer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    PolicyConditionCriteria:
      type: object
      properties:
        id:
          type: integer
          format: int32
        logic:
          type: string
        openPar:
          type: string
        field:
          type: string
        operator:
          type: string
        value:
          type: string
        closePar:
          type: string
    PolicyCoverage:
      type: object
      properties:
        id:
          type: integer
          format: int32
        peril:
          $ref: '#/components/schemas/ExposureValue'
        lossType:
          type: string
          enum:
          - Building
          - Contents
          - BI
          - CombinedCvg
        premium:
          type: number
          format: double
        limit:
          type: number
          format: double
        deductible:
          type: number
          format: double
        label:
          $ref: '#/components/schemas/ExposureValue'
        accumulation:
          type: integer
          format: int32
        isValid:
          type: boolean
        percentOfLossDeductibleAmount:
          type: number
          format: double
        isFranchiseDeductible:
          $ref: '#/components/schemas/ExposureValue'
      required:
      - label
      - lossType
      - peril
    Treaty:
      description: 'A reinsurance contract between an underwriter and a primary insurer that applies to a collection of related exposures. Under the terms of the treaty, the primary insurer (for example, a cedant) transfers risk to the underwriter in exchange for a premium and the reinsurer assumes financial responsibility for that risk.

        '
      type: object
      properties:
        treatyId:
          type: integer
          format: int32
        treatyNumber:
          type: string
          maxLength: 20
          minLength: 0
        treatyName:
          type: string
          maxLength: 40
          minLength: 0
        cedant:
          $ref: '#/components/schemas/Cedant'
        producer:
          $ref: '#/components/schemas/Producer'
        treatyType:
          description: The treaty type.
          $ref: '#/components/schemas/ExposureValue'
        currency:
          description: Indicates treaty currency. All monetary fields for a single treaty are considered to be in the same currency. However, treaties can be in a different currency than the exposures to which they are being attached. During analysis, Risk Modeler converts all currencies to the analysis currency..
          $ref: '#/components/schemas/ExposureValue'
        attachBasis:
          $ref: '#/components/schemas/ExposureValue'
        attachLevel:
          $ref: '#/components/schemas/ExposureValue'
        premium:
          type: number
          format: double
        occurLimit:
          description: Maximum amount that a treaty pays out for all locations for any event.
          type: number
          format: double
        attachPt:
          description: Value at which the treaty takes effect.
          type: number
          format: double
        riskLimit:
          type: number
          format: double
        retentAmt:
          type: number
          format: double
        pcntPlaced:
          type: number
          format: double
        effectDate:
          type: string
        expireDate:
          type: string
        pcntRetent:
          description: Percentage of the reinsurer's share of the treaty losses that are not covered by retrocessions. Determines the losses for the reinsurance net loss financial perspective and the net premium that a reinsurer receives for a treaty. Calculated as reinsurance gross loss multiplied by the percentage retention by treaty.
          type: number
          format: double
        pcntRiShare:
          type: number
          format: double
        pcntCovered:
          description: Percentage of loss greater than the attachment point covered by a treaty. Not applicable to Surplus Share treaties.
          type: number
          format: double
        priority:
          type: integer
          format: int32
        numOfReinst:
          type: integer
          format: int32
        reinstCharge:
          type: number
          format: double
        maolAmount:
          type: number
          format: double
        isValid:
          type: boolean
        userId1:
          type: string
        userId2:
          type: string
        lobs:
          type: array
          items:
            $ref: '#/components/schemas/LineOfBusiness'
        aggregateDeductible:
          type: number
          format: double
        aggregateLimit:
          type: number
          format: double
        lossOccurrences:
          type: array
          items:
            $ref: '#/components/schemas/LossOccurrence'
      required:
      - attachLevel
      - cedant
      - treatyNumber
      - treatyType
    Policy:
      required:
      - number
      - status
      type: object
      properties:
        id:
          type: integer
          format: int32
        number:
          type: string
        accountId:
          type: integer
          format: int32
        lob:
          $ref: '#/components/schemas/ExposureValue'
        peril:
          $ref: '#/components/schemas/ExposureValue'
        status:
          $ref: '#/components/schemas/ExposureValue'
        inceptionDate:
          type: string
        expirationDate:
          type: string
        currency:
          $ref: '#/components/schemas/ExposureValue'
        partOf:
          type: number
          format: double
        attachmentPoint:
          type: number
          format: double
        minDeductible:
          type: number
          format: double
        maxDeductible:
          type: number
          format: double
        blanketLimit:
          type: number
          format: double
        blanketDeductible:
          type: number
          format: double
        blanketPremium:
          type: number
          format: double
        biLifeLine:
          type: integer
          format: int32
        deductType:
          type: integer
          format: int32
        structure:
          $ref: '#/components/schemas/ExposureValue'
        coverageBase:
          $ref: '#/components/schemas/ExposureValue'
        limitGU:
          $ref: '#/components/schemas/ExposureValue'
        userText1:
          type: string
        userText2:
          type: string
        userText3:
          type: string
        userText4:
          type: string
        isValid:
          type: boolean
        coverages:
          type: array
          items:
            $ref: '#/components/schemas/PolicyCoverage'
        reinsuranceCessions:
          type: array
          items:
            $ref: '#/components/schemas/ReinsuranceCession'
        policyConditions:
          type: array
          items:
            $ref: '#/components/schemas/PolicyCondition'
        CustomData:
          type: object
          additionalProperties:
            type: string
        newCauseOfLoss:
          $ref: '#/components/schemas/ExposureValue'
        percentOfLossDeductible:
          type: number
          format: double
        isFranchiseDeductible:
          $ref: '#/components/schemas/ExposureValue'
        aggregateMinDeductible:
          description: Value of the minimum aggregate deductible.
          type: number
          format: double
        aggregateLimit:
          description: Value of the maximum aggregate payout for the policy.
          type: number
          format: double
    ReinsuranceCession:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        exposureId:
          type: integer
          format: int32
        exposureType:
          type: string
          enum:
          - POL
          - LOC
        type:
          type: string
          enum:
          - None
          - Facultative
          - Treaty
        facReinsurer:
          $ref: '#/components/schemas/FacReinsurer'
        treaty:
          $ref: '#/components/schemas/Treaty'
        layerNumber:
          type: integer
          format: int32
        layerAmount:
          type: number
          format: double
        excessAmount:
          type: number
          format: double
        percentReinsurance:
          type: number
          format: double
        maolAmount:
          type: number
          format: double
        priority:
          type: integer
          format: int32
        isValid:
          type: boolean
    ExposureValue:
      type: object
      properties:
        id:
          type: integer
          format: int32
        code:
          type: string
        name:
          type: string
    PolicyCondition:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        isPredefined:
          type: boolean
        limit:
          type: number
          format: double
        deductible:
          type: number
          format: double
        deductibleType:
          $ref: '#/components/schemas/ExposureValue'
        conditionType:
          $ref: '#/components/schemas/ExposureValue'
        parentCondition:
          $ref: '#/components/schemas/ExposureValue'
        policyNumber:
          type: string
        policyConditionCriterias:
          type: array
          items:
            $ref: '#/components/schemas/PolicyConditionCriteria'
        percentOfLossDeductibleAmount:
          type: number
          format: double
        isFranchiseDeductible:
          $ref: '#/components/schemas/ExposureValue'
    LossOccurrence:
      type: object
      properties:
        id:
          type: integer
          format: int32
        treatyId:
          type: integer
          format: int32
        regionPeril:
          $ref: '#/components/schemas/ExposureValue'
        lossOccurrenceTime:
          type: integer
          format: int32
        lossOccurrenceRadius:
          type: integer
          format: int32
        radiusUnit:
          $ref: '#/components/schemas/ExposureValue'
        multiLossOccurrence:
          $ref: '#/components/schemas/ExposureValue'
      required:
      - treatyId
    ErrorMessage:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        logId:
          type: string
    CopyPolicyInfo:
      type: object
      properties:
        id:
          type: integer
          format: int32
    LineOfBusiness:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 20
          minLength: 0
      required:
      - name
    LocationCondition:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        conditionId:
          type: integer
          format: int32
        isIncluded:
          type: string
          enum:
          - NotIncluded
          - Included
          - UserIncluded
    Producer:
      description: Agent or brokerage firm that produced a policy.
      type: object
      properties:
        id:
          type: string
          maxLength: 20
          minLength: 0
          pattern: ^\w([\w-]*\w|)$
        name:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - name
    PolicySearchResult:
      type: object
      properties:
        matchCount:
          type: integer
          format: int64
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
    Cedant:
      description: A risk-holding party (insurer/reinsurer) that is transferring a portion of risk to another risk-holding party (reinsurer/retrocessionaire).
      type: object
      properties:
        id:
          type: string
          maxLength: 20
          minLength: 0
          pattern: ^\w([\w-]*\w|)$
        name:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - name
  securitySchemes:
    RMS_Auth:
      type: apiKey
      name: Authorization
      in: header
      description: An API key is a token that enables a client application to make requests to tenant applications running on Intelligent Risk Platform.
      x-default: XXXXXXXXXX
x-readme:
  explorer-enabled: false
  samples-languages:
  - curl
  - java
  - csharp
  - node
  - python
  proxy-enabled: true
  samples-enabled: true
