        modelVersion:
          type: string
        eventRateSchemeName:
          type: string
        eventRateSchemeId:
          type: integer
          format: int32
        isDefault:
          type: boolean
        isActive:
          type: boolean
    ConvertEventInput:
      type: object
      properties:
        analysisName:
          description: 'The name for the analysis with converted rates and/or losses. Valid characters: `0`-`9`, `A`-`Z`, `a`-`z`, `_` (underscore), `-` (hyphen), and '''' '''' (blank space).  String cannot start or end with a hyphen (`-`), colon (`:`), or blank space and cannot include multiple consecutive hyphens (`--`).

            '
          type: string
          example: NewAnalysisName
          maxLength: 64
          minLength: 0
          pattern: ^\w((?!--)[\w\s:-])*\w$|^\w*$
        eventRateSchemeIds:
          description: 'Array of <<glossary:event rate scheme>>s identified by ID number.

            '
          type: array
          items:
            type: integer
            format: int32
        eventLossAdjustmentSchemeIds:
          description: 'Array of <<glossary:event loss adjustment scheme>>s identified by ID number.

            '
          type: array
          items:
            type: integer
            format: int32
