components:
  schemas:
    ClimateChangeInput:
      type: object
      properties:
        analysisName:
          description: Name of climate change analysis. Can be alphanumeric string.
          type: string
          example: ABC Climate
        climateConditionView:
          description: 'One of `Combined All Parameters`, `Frequency and Intensity Only`, `Default`

            '
          type: string
          example: Combined All Parameters
        referenceRateSchemeId:
          description: 'ID of <<glossary:event rate>> scheme conditioned for climate change. One of `190`, `202`, `84`, `9`.

            * `190`: RMS 2019 Historical Event Rates

            * `202`: RMS 2021 Historical Event Rates

            * `84`: RMS 2015 Historical Event Rates

            * `9`: RMS v2.0 Default Rates

            '
          type: integer
          format: int32
          example: 190
        rcpScenario:
          description: 'RCP scenario. One of `2.6`, `4.5`, `6.0`, or `8.5`.

            * `2.6`: A pathway where radiative forcing peaks at approximately 3 W m-2 before 2100 and then declines to 2.6 W m-2.

            * `4.5`: An intermediate stabilization pathway in which radiative forcing is stabilized at approximately 4.5 W m-2 and 6.0 W m-2 after 2100.

            * `6.0`: An intermediate stabilization pathways in which radiative forcing is stabilized at approximately 4.5 W m-2 and 6.0 W m-2 after 2100.

            * `8.5`: A high pathway for which radiative forcing reaches greater than 8.5 W m-2 by 2100 and continues to rise for some amount of time.

            '
          type: number
          format: double
          example: 2.6
        timeHorizon:
          description: 'One or more the snapshots included in an RCP scenario-based analysis. Values must be between `2020` and `2100` in five year increments. For example, `2020, 2025, 2030, 2035`

            '
          type: integer
          format: int32
          example: 2025
        is2CWarmingScenario:
          description: 'Indicates whether the climate change analysis includes RCP scenarios. If no `rcpScenario` or `timeHorizon` values are specified, set to `false`.

            '
          type: boolean
    Bucket:
      type: object
