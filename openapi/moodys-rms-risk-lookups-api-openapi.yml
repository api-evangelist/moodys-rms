            | ERR_4040 | Not found. |

            | ERR_4050 | Method not allowed. |

            | ERR_4060 | Not acceptable. |

            | ERR_4080 | Request timeout. |

            | ERR_4130 | Request too large. |

            | ERR_4150 | Unsupported media type. |

            | ERR_4220 | Unprocessable entity. |

            | ERR_4290 | Quota exceeded. |

