openapi: 3.2.0
info:
  title: Location Intelligence Risk Lookups API
  version: 2022.09.c
  description: Use LI API data to access RMS model insights in a flexible, scalable, and programmable way. The suite of layers includes exposure enhancement, geocoding, hazard, risk scoring, and loss costs to provide information for key decisions in the underwriting workflow, including screening, selection, and pricing.
servers:
- url: https://{host}/li
  description: Location Intelligence
  variables:
    host:
      enum:
      - api-euw1.rms.com
      - api-use1.rms.com
      default: api-euw1.rms.com
      description: 'Data center that hosts the tenant instance: api-euw1.rms.com or api-use1.rms.com.'
security:
- apiKey: []
tags:
- name: Risk Lookups
  description: Returns one exposure, hazard, risk score, or loss cost layer for an address
paths:
  /{layer}/{version}:
    post:
      tags:
      - Risk Lookups
      summary: Generic Lookup
      operationId: genericLookup
      parameters:
      - name: layer
        in: path
        description: Layer name
        example: us_fema_firm
        required: true
        schema:
          type: string
      - name: version
        in: path
        description: Layer version
        example: latest
        required: true
        schema:
          type: string
      requestBody:
        description: Request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericInput'
        required: true
      responses:
        '200':
          description: Everything worked as expected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOutput'
        '400':
          $ref: '#/components/responses/400Response'
        '401':
          $ref: '#/components/responses/401Response'
        '404':
          $ref: '#/components/responses/404Response'
        '500':
          $ref: '#/components/responses/500Response'
  /au_eq_loss_cost/18.1:
    post:
      tags:
      - Risk Lookups
      summary: Australia Earthquake Loss Cost 18.1
      requestBody:
        description: Request
        content:
          application/json:
            schema:
              type: object
              required:
              - location
              properties:
                location:
                  type: object
                  allOf:
                  - $ref: '#/components/schemas/LocationInput'
                  - type: object
                  properties:
                    address:
                      type: object
                      required:
                      - latitude
                      - longitude
                      - countryRmsCode
                      - rmsGeoModelResolutionCode
                      - postalCodeGeoId
                      example:
                        $ref: '#/components/examples/AuAddress/value'
                    characteristics:
                      example:
                        $ref: '#/components/examples/CharacteristicsBasic/value'
                    coverageValues:
                      $ref: '#/components/schemas/CoverageValuesInput'
                layerOptions:
                  type: object
                  properties:
                    deductibleType:
                      type: integer
                      description: 'Deductible type: * `1` - Building * `2` - Contents * `3` - BI * `4` - Combined * `5` - Site

                        '
                      minimum: 1
                      maximum: 5
                      example: 1
                    deductibleAmount:
                      type: number
                      format: double
                      description: Deductible amount in %, or dollar amount
                      example: 0.1
                    deductibleAmount2:
                      type: number
                      format: double
                      description: Deductible 2 amount in %, or dollar amount
                      example: 0.05
                    deductibleAmount3:
                      type: number
                      format: double
                      description: Deductible 3 amount in %, or dollar amount
                      example: 0.02
        required: true
      responses:
        '200':
          description: Everything worked as expected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuGrLossCostOutput'
        '400':
          $ref: '#/components/responses/400Response'
        '401':
          $ref: '#/components/responses/401Response'
        '500':
          $ref: '#/components/responses/500Response'
