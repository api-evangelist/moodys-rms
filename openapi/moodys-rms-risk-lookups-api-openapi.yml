    post:
      tags:
      - Risk Lookups
      summary: Europe Flood Depth 1.0
      requestBody:
        description: Request
        content:
          application/json:
            schema:
              type: object
              required:
              - location
              properties:
                location:
                  type: object
                  allOf:
                  - $ref: '#/components/schemas/LocationInput'
                  - type: object
                  properties:
                    address:
                      type: object
                      required:
                      - latitude
                      - longitude
                      - countryRmsCode
                      - rmsGeoModelResolutionCode
                      example:
                        $ref: '#/components/examples/EuGbAddress/value'
                    characteristics:
                      type: object
                      example: {}
                    coverageValues:
                      type: object
                      example: {}
                layerOptions:
                  type: object
                  properties:
                    lookup:
                      type: string
                      enum:
                      - floodDepth
                      - wetOrDry
                      - proximity
                      description: 'Type of lookup: * `floodDepth` - Lookup flood depths * `wetOrDry` - Lookup if the location is wet or dry * `proximity` - Lookup max depth within proximity

                        '
                      default: floodDepth
                      example: proximity
                    defended:
                      type: boolean
                      description: Max depth is defended/undefended (only applies to lookup type `proximity`)
                      default: false
                      example: false
                    returnPeriod:
                      type: integer
                      description: Return period for max depth calculation (only applies to lookup type `proximity`)
                      default: 1000
                      example: 1000
                    proximityDistance:
                      type: number
                      format: double
                      description: Return max depth found within this distance from the address (only applies to lookup type `proximity` and the maximum distance allowed is 1000 meters)
                      example: 100
                      default: 100
                    distanceUnit:
                      type: string
                      enum:
                      - feet
                      - meters
                      description: Distance unit
                      default: meters
        required: true
      responses:
        '200':
          description: Everything worked as expected.
          content:
            application/json:
              schema:
                type: object
                anyOf:
                - $ref: '#/components/schemas/FlDepthInlandSurgeOutput'
                - $ref: '#/components/schemas/FlDepthBaseOutput'
                - $ref: '#/components/schemas/FlDepthInlandProximityOutput'
