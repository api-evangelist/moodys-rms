components:
  schemas:
    AnalysesItemV2:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        runDate:
          type: string
        description:
          type: string
        rdmName:
          type: string
        regroup:
          type: integer
          format: int32
        exposureType:
          type: integer
          format: int32
        engineVersion:
          type: string
        groupType:
          type: string
        cedant:
          type: string
        lob:
          type: string
        exposureId:
          type: integer
          format: int32
        dataSource:
          type: string
        riGuid:
          type: string
        jobId:
          type: integer
          format: int64
        jobUUID:
          type: string
        isGroup:
          type: boolean
        modelProfile:
          $ref: '#/components/schemas/ExposureValue'
        outputProfile:
          $ref: '#/components/schemas/ExposureValue'
        engine:
          $ref: '#/components/schemas/ExposureValue'
        status:
          $ref: '#/components/schemas/ExposureValue'
        type:
          $ref: '#/components/schemas/ExposureValue'
        peril:
          $ref: '#/components/schemas/ExposureValue'
        subPeril:
          $ref: '#/components/schemas/ExposureValue'
        region:
          $ref: '#/components/schemas/ExposureValue'
        lossAmplification:
          $ref: '#/components/schemas/ExposureValue'
        mode:
          $ref: '#/components/schemas/ExposureValue'
        insuranceType:
          $ref: '#/components/schemas/ExposureValue'
        vulnerabilityCurve:
          $ref: '#/components/schemas/ExposureValue'
        user:
          $ref: '#/components/schemas/ExposureValue'
        eventRateSchemes:
          type: array
          items:
            type: string
        currency:
          $ref: '#/components/schemas/AnalysisCurrency'
        engineSubType:
          $ref: '#/components/schemas/ExposureValue'
        framework:
          type: string
        simulationSetId:
          type: integer
          format: int64
        simulationPeriods:
          type: integer
          format: int32
        exposureSetId:
          type: string
    AggregatePortfolioMetrics:
      type: object
      properties:
        totalAggregateExposures:
          type: integer
          format: int32
        perilsExposed:
          type: string
        total:
          type: number
          format: double
        name:
          type: string
        number:
          type: string
        source:
          type: string
        currency:
          type: string
        createDate:
          type: string
        owner:
          type: string
        cedant:
          type: string
    LineOfBusiness:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 20
          minLength: 0
      required:
      - name
    AlmProcessInput:
      type: object
      properties:
        exposureType:
          type: string
          enum:
          - PORTFOLIO
          - ACCOUNT
          - LOCATION
          - POLICY
          - STEP_POLICY
          - TREATY
          - AGGPORTFOLIO
        edm:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        modelProfileId:
          type: integer
          format: int32
        eventRateSchemeId:
          type: integer
          format: int32
        treaties:
          type: array
          items:
            type: integer
            format: int32
        jobName:
          type: string
          maxLength: 64
          minLength: 0
