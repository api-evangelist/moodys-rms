        schema:
          type: integer
          format: int32
      - name: userName
        in: query
        description: Name of <<glossary:principal>> that ran the analysis.
        schema:
          type: string
      - name: runDate
        in: query
        description: Date that the analysis was run.
        schema:
          type: string
      responses:
        '200':
          description: Analyses for exposure successfully retrieved.
          content:
            application/json:
