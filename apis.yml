aid: moodys-rms
url: https://raw.githubusercontent.com/api-evangelist/moodys-rms/refs/heads/main/apis.yml
name: Moody's RMS
kind: company
description: >-
  Moody's RMS is the catastrophe risk modeling and risk-data business of Moody's Corporation, headquartered in Newark,
  California in its home market of the United States and serving property and casualty insurers, reinsurers, brokers,
  and capital-market participants worldwide. Founded at Stanford in 1988 as Risk Management Solutions and acquired by
  Moody's in 2021, the company sells peril models (hurricane, earthquake, flood, wildfire, severe convective storm,
  terror, cyber, pandemic) and the exposure data infrastructure that carriers use to price, accumulate, and transfer
  catastrophe risk. Its products run on the cloud-native Intelligent Risk Platform, which fronts Risk Modeler,
  ExposureIQ, UnderwriteIQ, TreatyIQ, and Risk Data Exchange. Unlike most of the US insurance sector, Moody's RMS is
  genuinely API-forward: it operates a public, self-serve ReadMe developer portal at developer.rms.com covering
  Platform APIs, Risk Modeler, Data Bridge, Location Intelligence, and Climate On Demand, publishes downloadable
  OpenAPI 3.0 definitions and public Postman collections from its own rms-developers GitHub repository, and exposes
  live REST hosts at api-use1.rms.com and api-euw1.rms.com. Reference documentation is readable without a login, but
  the APIs themselves are tenant-scoped: keys are issued only to licensed Intelligent Risk Platform tenants, so there
  is no self-serve signup and no sandbox. Its data-standards posture is cat-risk rather than ACORD — the exchange
  formats are the RMS EDM/RDM databases, the Risk Data Open Standard (RDOS), and interoperability with CEDE and OED;
  ACORD appears only as a geocoding-resolution code mapping inside the Location Intelligence API. These are risk-data
  and analytics APIs, not policy APIs: no quote, bind, issue, or FNOL surface is published.
