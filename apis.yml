apis:
- aid: moodys-rms:platform-apis
  name: Moody's RMS Platform APIs
  description: >-
    A collection of REST APIs that let Intelligent Risk Platform tenants automate portfolio management, underwriting,
    and risk-transfer workflows across Risk Modeler, UnderwriteIQ, TreatyIQ, ExposureIQ, and Risk Data Exchange. The
    public reference is segmented into roughly two dozen families including Import, Export, Batch, Model, Accumulation,
    Rollup, Grouping, Geohaz, Bulk Geohazard, Enrich Exposure, Currency Conversion, Auto Select, Clone, Copy, ESG Data,
    Exchange Data, Reference Data, Risk Data, Admin Data, Tenant Data, Security, STEP, and Variation. No downloadable
    OpenAPI definition was published for this family at the time of review.
  humanURL: https://developer.rms.com/platform
  tags:
  - Platform
  - Exposure Management
  - Catastrophe Modeling
  properties:
  - type: Documentation
    url: https://developer.rms.com/platform/docs
  - type: APIReference
    url: https://developer.rms.com/platform/reference
  - type: PostmanCollection
    url: https://www.postman.com/rms-developers/rms-developers/overview
- aid: moodys-rms:risk-modeler-api
  name: Moody's RMS Risk Modeler API
  description: >-
    The Risk Modeler 2.0 public API — the legacy catastrophe-modeling and underwriting surface of the Intelligent Risk
    Platform, superseded by the Platform APIs but still documented and specified. The harvested OpenAPI 3.0.1
    definition carries 280 paths covering exposure and EDM/RDM management, account and portfolio data, model profiles,
    analysis runs, results and metrics, imports and exports, geohazard lookups, and job orchestration.
  humanURL: https://developer.rms.com/risk-modeler
  baseURL: https://api-use1.rms.com/riskmodeler
  tags:
  - Catastrophe Modeling
  - Exposure Management
  - Underwriting
  properties:
  - type: Documentation
    url: https://developer.rms.com/risk-modeler
  - type: APIReference
    url: https://developer.rms.com/risk-modeler/reference
  - type: OpenAPI
    url: openapi/moodys-rms-risk-modeler-openapi.yml
  - type: PostmanCollection
    url: https://github.com/RMS/rms-developers/blob/master/.assets/rm/rm2-postman.zip
- aid: moodys-rms:data-bridge-api
  name: Moody's RMS Data Bridge API
  description: >-
    Administers database connections and moves exposure and results data into and out of the Intelligent Risk Platform.
    The harvested OpenAPI 3.0.1 definition carries 21 paths covering database and server management, EDM/RDM database
    creation and deletion, upload and download of exposure databases, and the job status endpoints that track those
    transfers.
  humanURL: https://developer.rms.com/databridge
  baseURL: https://api-use1.rms.com/databridge
  tags:
  - Data Exchange
  - Exposure Data
  - ETL
  properties:
  - type: Documentation
    url: https://developer.rms.com/databridge
  - type: APIReference
    url: https://developer.rms.com/databridge/reference
  - type: OpenAPI
    url: openapi/moodys-rms-data-bridge-openapi.json
- aid: moodys-rms:location-intelligence-api
  name: Moody's RMS Location Intelligence API
  description: >-
    Address geocoding and per-location peril and hazard risk lookups used to enrich exposure before modeling. The
    harvested OpenAPI 3.0.1 definition carries 366 paths under three declared tags — Geocoding, Composite, and Risk
    Lookups — returning geocode resolution (including a code mapped to the ACORD standard resolution scale), hazard
    scores, and peril-specific risk attributes by location.
  humanURL: https://developer.rms.com/location-intelligence
  baseURL: https://api-use1.rms.com/li
  tags:
  - Geocoding
  - Risk Data
  - Hazard
  properties:
  - type: Documentation
    url: https://developer.rms.com/location-intelligence
  - type: APIReference
    url: https://developer.rms.com/location-intelligence/reference
  - type: OpenAPI
    url: openapi/moodys-rms-location-intelligence-openapi.yaml
  - type: PostmanCollection
    url: https://github.com/RMS/rms-developers/blob/master/.assets/li/li-postman.json.zip
- aid: moodys-rms:climate-on-demand-api
  name: Moody's RMS Climate On Demand API
  description: >-
    Physical climate risk data delivered as an API so financial-services organizations can build climate applications
    on the Intelligent Risk Platform. The public developer page documents four product surfaces — CoD Real Assets Stn,
    CoD Real Assets Pro, CoD Corporates, and CoD Spatial Areas — and offers a public Postman collection. No
    downloadable OpenAPI definition was found for this family at the time of review.
  humanURL: https://developer.rms.com/climate-on-demand
  tags:
  - Climate Risk
  - Physical Risk
  - ESG
  properties:
  - type: Documentation
    url: https://developer.rms.com/climate-on-demand
