- aid: moodys-rms:platform-mcp-server
  name: Moody's RMS Platform MCP Server
  description: >-
    A hosted Model Context Protocol server, irp-integration-mcp, released with Intelligent Risk Platform
    version 2026.07.c on 2026-06-30. It transforms the Platform API specifications, documentation, and
    code samples into a single queryable knowledge graph so that tenant AI applications can discover and
    implement catastrophe modeling and reinsurance workflows. Sixteen tools ship across five categories
    — Knowledge Graph, API Discovery, API Execution, Skills (beta), and Session Management — but only
    one of them, execute-api, actually calls Platform API operations; the rest reason over the graph.
    The transport is Streamable HTTP on two regional endpoints, and every request is authenticated at
    Moody's API gateway by an Intelligent Risk Platform API key whose user group carries the IRP Agentic
    Tools User role. Supported hosts include Claude Code, Claude Desktop, Cursor, Devin, JetBrains AI
    Assistant, and Visual Studio Code. All tenant data stays on the Intelligent Risk Platform.
  humanURL: https://developer.rms.com/platform/docs/platform-mcp-server-overview
  baseURL: https://api-use1.rms.com/platform/integration/v1/mcp
  tags:
  - MCP
  - Agents
  - Catastrophe Modeling
