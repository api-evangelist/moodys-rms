apis:
- aid: moodys-rms:platform-apis
  name: Moody's RMS Platform APIs
  description: >-
    A collection of REST APIs that let Intelligent Risk Platform tenants automate portfolio management,
    underwriting, and risk-transfer workflows across Risk Modeler, UnderwriteIQ, TreatyIQ, ExposureIQ,
    and Risk Data Exchange. The public reference is segmented into roughly two dozen families including
    Import, Export, Batch, Model, Accumulation, Rollup, Grouping, Geohaz, Bulk Geohazard, Enrich Exposure,
    Currency Conversion, Auto Select, Clone, Copy, ESG Data, Exchange Data, Reference Data, Risk Data,
    Admin Data, Tenant Data, Security, STEP, and Variation. No downloadable OpenAPI definition was published
    for this family at the time of review.
  humanURL: https://developer.rms.com/platform
  baseURL: https://api-use1.rms.com/platform
