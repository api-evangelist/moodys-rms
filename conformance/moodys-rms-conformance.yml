note: >-
  Standards posture for Moody's RMS. This is a catastrophe-risk data provider, so the standards that
  matter are the exposure-data standards (EDM/RDM, RDOS, CEDE, OED), not the policy-transaction standards
  (ACORD) that govern carriers and agency systems. Cross-cutting web-API standards conformance is derived
  from the three published OpenAPI definitions and the provider's published policies.
