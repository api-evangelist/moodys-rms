aid: moodys-rms
name: Moody's RMS
review:
  question: >-
    Does Moody's RMS expose a real, public, self-serve developer portal with downloadable API
    specifications, and what is its ACORD posture as an insurance-sector data provider?
  answer: true
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  gated: true
  gatedNote: >-
    Documentation is fully public and readable without a login, but credentials are not self-serve.
    API keys and security tokens are issued only to licensed Intelligent Risk Platform tenants, so
    the integration surface itself is customer-gated. There is no signup flow, free tier, or sandbox.
findings:
  summary: |
    Moody's RMS is one of the genuine API-forward outliers in a US insurance market that has no
    federal regulator and no open-insurance mandate. It sits in the risk-data and analytics layer
    between carriers and distribution — exactly where value accrued under the McCarran-Ferguson
    settlement — and it behaves like a software vendor rather than a carrier.

    The developer portal at https://developer.rms.com/ returned HTTP 200 on 2026-07-25 and is a
    real, self-serve, publicly readable ReadMe (SuperHub) documentation hub, not a login wall and
    not a marketing "innovation" page. Its home page enumerates five product areas, each a separate
    ReadMe project with its own Guides / API Reference / Changelog / FAQ tabs, all readable
    anonymously: /platform, /risk-modeler, /databridge, /location-intelligence, and
    /climate-on-demand. The Platform API Reference alone lists roughly two dozen API families.

    Three OpenAPI 3.0.1 definitions were harvested verbatim from the vendor's own public developer
    assets repository, github.com/RMS/rms-developers, which is the same repository the portal serves
    its stylesheet and product imagery from. Together they describe 667 paths. No downloadable
    definition was found for the newer Platform APIs or for Climate On Demand; those are documented
    as rendered reference pages plus Postman collections only.

    The API hosts are live and real: an anonymous GET to
    https://api-use1.rms.com/riskmodeler/v1/exposures returned HTTP 401, confirming the documented
    host and rejecting unauthenticated access as expected.

    None of the four insurance policy verbs are exposed. This is a risk-data and catastrophe-analytics
    surface — exposure management, model execution, accumulation, geocoding, hazard lookup, climate
    risk — consumed by carrier and reinsurer analytics teams. Underwriting is supported as decision
    support (UnderwriteIQ), not as a quote/bind transaction.
