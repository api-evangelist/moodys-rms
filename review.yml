  acordPosture:
    phrase: >-
      No ACORD transactional surface — cat-risk standards instead (EDM/RDM, Risk Data Open Standard,
      CEDE/OED); ACORD appears only as a geocode-resolution code mapping
    evidence:
      - >-
        Zero occurrences of "ACORD", "AL3", "NGDS", "IVANS", "Vertafore" or "agency download" in the
        Risk Modeler (280-path) or Data Bridge (21-path) OpenAPI definitions.
      - >-
        Exactly one ACORD reference across all harvested specs, in the Location Intelligence API:
        field `rmsGeocodingResolutionCode`, described as "Indicates the geocoding resolutions that are
        supported by the ACORD standard". This is a code-list alignment, not an ACORD message surface.
      - >-
        The company's actual exchange formats are its own: EDM (Exposure Data Module) and RDM
        databases — 358 EDM and 28 RDM references in the Risk Modeler spec — plus the Risk Data Open
        Standard (RDOS) that RMS authored and published, with documented import/transform services for
        the CEDE and OED cat-exposure schemas.
      - >-
        Risk Data Exchange moves EDM/RDM databases and DLM/HD analysis results between platform
        tenants — a vendor-native exchange, not IVANS agency download or ACORD XML.
    summary: >-
      This is the sector-diagnostic finding for Moody's RMS. Where a carrier or agency-system vendor
      would show ACORD AL3 / ACORD XML moving over IVANS, a cat-risk vendor shows an entirely parallel
      standards stack it wrote itself. ACORD governs the policy/submission idiom; RDOS, EDM/RDM, CEDE
      and OED govern the exposure idiom. Moody's RMS lives wholly in the second.
  insuranceVerbs:
    quote: false
    bind: false
    issue: false
    fnol: false
    note: >-
      None of the four policy verbs are exposed. The published surface covers exposure import/export,
      catastrophe model execution, analysis results and metrics, accumulation and rollup, grouping,
      currency conversion, geocoding, hazard and peril lookup, ESG and climate data, and tenant/security
      administration. UnderwriteIQ supports underwriting as risk-scoring decision support consumed by
      carrier and reinsurer analytics teams — it is not a quote or bind transaction API. Audience is
      partner/tenant (licensed carriers, reinsurers, brokers, ILS and capital-markets participants),
      never consumer and never agent self-serve.
  authModel:
    scheme: API key
    detail: >-
      Every harvested specification declares a single security scheme, `RMS_Auth`: type apiKey, in
      header, name Authorization. The portal describes access as controlled "by means of API keys and
      security tokens", where every request must present a valid API key or security token. No OAuth2
      flow, no mTLS, and no OpenID discovery document is published; /.well-known probes returned 404
      on the portal and 403 on the API hosts.
    hosts:
      - https://api-use1.rms.com
      - https://api-euw1.rms.com
    hostNote: >-
      Specs template the host as a server variable with an enum of the two regional data centers that
      host a tenant instance.
  webhooks:
    present: false
    asyncapi: false
    note: >-
      No event catalog, webhook registry, or AsyncAPI document was found. Long-running work is handled
      by a polling job model instead — the Platform reference documents a Platform Jobs family and the
      Risk Modeler and Data Bridge specs expose job-status endpoints that clients poll for completion.
  postman:
    present: true
    publicWorkspace: https://www.postman.com/rms-developers/rms-developers/overview
    httpStatus: 200
    collections:
