        url: https://www.postman.com/rms-developers/workspace/cod/collection/21620294-578a748b-78a6-4a3a-b4b3-5c5380b7848e
        httpStatus: 200
      - name: Risk Modeler 2.0 (downloadable archive, with prod/npe environments for us-east-1 and eu-west-1)
        url: https://github.com/RMS/rms-developers/blob/master/.assets/rm/rm2-postman.zip
        httpStatus: 200
      - name: Location Intelligence (downloadable archive)
        url: https://github.com/RMS/rms-developers/blob/master/.assets/li/li-postman.json.zip
        httpStatus: 200
  graphql:
    present: false
    note: No GraphQL endpoint or SDL is documented.
  grpc:
    present: false
    note: No .proto files are published.
  transports:
    - protocol: REST
