security_policy:
  url: https://developer.rms.com/platform/docs/policies
  summary: >-
    Access to the Intelligent Risk Platform is controlled by API keys and security tokens; every request
    must present a valid credential or be rejected. Tenants define granular access controls through
    role-based permissions and group-based access rights. All calls to and from the platform are
    encrypted.
