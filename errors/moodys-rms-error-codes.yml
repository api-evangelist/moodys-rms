source: https://developer.rms.com/platform/docs/custom-error-codes
docs: https://developer.rms.com/platform/docs/custom-error-codes
format: vendor-error-code
note: Moody's RMS Platform APIs do not use RFC 9457 problem+json. Application errors are returned as a JSON object with code, message and logId. The code is a domain prefix plus a number (for example ACCT-001).
  Message strings use %d and %s placeholders that the API substitutes at runtime. Captured verbatim from the published Custom Error Codes reference.
envelope:
  media_type: application/json
  fields:
  - field: code
    type: string
    description: 'Internal error code: a domain prefix that identifies the error type (e.g. INT) plus a number identifying the specific error (e.g. 999).'
  - field: message
    type: string
    description: Error message describing the cause of the error, sometimes including details or resolution steps.
  - field: logId
    type: string
    description: ID of the error in the response log.
  example:
    code: INT-999
    message: The resource ID is not specified.
    logId: e5c4187b4deee9c09
http_status_codes:
  docs: https://developer.rms.com/platform/docs/http-status-codes
  note: Platform APIs use standard HTTP response status codes as defined in RFC 9110.
